<svg viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boldGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA0" />
      <stop offset="30%" stop-color="#F5C842" />
      <stop offset="65%" stop-color="#DF9C16" />
      <stop offset="90%" stop-color="#FDE184" />
      <stop offset="100%" stop-color="#B87D0E" />
    </linearGradient>

    <linearGradient id="arrowShadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DF9C16" />
      <stop offset="100%" stop-color="#9E6907" />
    </linearGradient>

    <linearGradient id="navyInnerFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1B2F" />
      <stop offset="50%" stop-color="#0B1526" />
      <stop offset="100%" stop-color="#070E1A" />
    </linearGradient>

    <filter id="goldAura" x="-25%" y="-25%" width="150%" height="150%">
