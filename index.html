  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />

    <meta name="description" content="Automate your business productivity and accelerate sales with the complete 6-software growth suite (Mailchimp, Hostinger, Fomo, Wati, UptimeRobot, Bitly) starting from as low as $15/month." />
    <meta property="og:title" content="Bizz2u 6-in-1 Business Automation Suite | From $15/Month" />
    <meta property="og:description" content="Automate your business productivity and accelerate sales with the complete 6-software growth suite (Mailchimp, Hostinger, Fomo, Wati, UptimeRobot, Bitly) starting from as low as $15/month." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // GitHub Pages fix: Ensure trailing slash on folder paths so relative assets load reliably
      (function() {
        var p = window.location.pathname;
        if (!p.endsWith('/') && p.split('/').pop().indexOf('.') === -1) {
          window.location.replace(p + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
    <style>
      /* Clean Google Translate Integration - hide default Google top frame */
      .goog-te-banner-frame.skiptranslate,
      .goog-te-banner-frame {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
      }
      body {
        top: 0px !important;
        position: static !important;
        overflow-x: hidden !important;
        max-width: 100vw;
      }
      html {
        overflow-x: hidden !important;
        max-width: 100vw;
      }
      .goog-tooltip,
      #goog-gt-tt,
      .goog-te-balloon-frame {
        display: none !important;
      }
      .goog-text-highlight {
        background-color: transparent !important;
        box-shadow: none !important;
      }
      font {
        background: transparent !important;
        box-shadow: none !important;
      }
    </style>
  </head>
  <body class="bg-[#090D16] text-slate-100 antialiased font-sans selection:bg-emerald-500 selection:text-black" style="background-color: #090D16; color: #f8fafc; margin: 0; min-height: 100vh;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      // GitHub Pages fallback: If running statically on GitHub Pages root without Vite, load compiled bundle
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = './assets/bundle.css';
          link.onerror = function() { link.href = './docs/assets/bundle.css'; };
          document.head.appendChild(link);

          var script = document.createElement('script');
          script.type = 'module';
          script.crossOrigin = 'anonymous';
          script.src = './assets/bundle.js';
          script.onerror = function() { script.src = './docs/assets/bundle.js'; };
          document.body.appendChild(script);
        }
      }, 350);
    </script>
  </body>
</html>
