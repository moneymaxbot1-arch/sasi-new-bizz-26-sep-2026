    <script>
      // Global resilience filter: Silently catch non-fatal 3rd-party translation scripts exceptions
      window.addEventListener('error', function(e) {
        if (e && (
          (e.filename && (e.filename.indexOf('translate.google') !== -1 || e.filename.indexOf('translate.googleapis.com') !== -1)) ||
          (e.message && (e.message.indexOf('translate_http') !== -1 || e.message.indexOf('goog-te') !== -1))
        )) {
          if (e.preventDefault) e.preventDefault();
          if (e.stopPropagation) e.stopPropagation();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        var reason = e ? (e.reason || '') : '';
        var reasonStr = String(reason.stack || reason.message || reason);
        if (reasonStr.indexOf('translate.googleapis.com') !== -1 || 
            reasonStr.indexOf('translate.google') !== -1 || 
            reasonStr.indexOf('translate_http') !== -1) {
          if (e.preventDefault) e.preventDefault();
          if (e.stopPropagation) e.stopPropagation();
        }
      });

    <script type="module">
      // Universal static hosting bootloader: Detects when hosted statically (Hostverge, cPanel, Apache, GitHub Pages, bizz2u.com)
      (function() {
        if (typeof window !== 'undefined' && (window.__vite_plugin_react_preamble_installed__ || window.__vite_plugin_react_timeout)) {
          return;
        }
        function bootProductionBundle() {
          if (typeof window !== 'undefined' && (window.__vite_plugin_react_preamble_installed__ || window.__vite_plugin_react_timeout)) {
            return;
          }
          var root = document.getElementById('root');
          if (root && root.children.length === 0) {
            var ts = Date.now();
            
            // Inject compiled bundle.css if styles not yet loaded
            if (!document.querySelector('link[data-bizz2u-css="true"]')) {
              var cssCandidates = [
                './assets/bundle.css',
                './docs/assets/bundle.css',
                './dist/assets/bundle.css',
                '/assets/bundle.css',
                '/docs/assets/bundle.css'
              ];
              var cssIdx = 0;
              var link = document.createElement('link');
              link.rel = 'stylesheet';
              link.setAttribute('data-bizz2u-css', 'true');
              link.href = cssCandidates[0] + '?v=' + ts;
              link.onerror = function() {
                cssIdx++;
                if (cssIdx < cssCandidates.length) {
                  link.href = cssCandidates[cssIdx] + '?v=' + ts;
                }
              };
              document.head.appendChild(link);
            }

            // Inject compiled bundle.js
            var jsCandidates = [
              './assets/bundle.js',
              './docs/assets/bundle.js',
              './dist/assets/bundle.js',
              '/assets/bundle.js',
              '/docs/assets/bundle.js'
            ];
            var jsIdx = 0;
            function tryLoadScript() {
              if (jsIdx >= jsCandidates.length) return;
              var script = document.createElement('script');
              script.type = 'module';
              script.crossOrigin = 'anonymous';
              script.setAttribute('data-bizz2u-js', 'true');
              script.src = jsCandidates[jsIdx] + '?v=' + ts;
              script.onerror = function() {
                jsIdx++;
                tryLoadScript();
              };
              document.body.appendChild(script);
            }
            tryLoadScript();
          }
        }

        // Check if root rendered; if not (no Vite server), boot the compiled production bundles
        setTimeout(bootProductionBundle, 350);
        setTimeout(bootProductionBundle, 1200);
      })();
    </script>
