<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" style="background-color: #070B14; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#141108" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)" />
  <rect width="1920" height="1080" fill="url(#grid)" />
  <circle cx="960" cy="540" r="450" fill="#F59E0B" opacity="0.06" filter="blur(120px)" />

  <!-- Header -->
  <g transform="translate(140, 100)">
    <rect x="0" y="0" width="280" height="38" rx="19" fill="#78350F" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" />
    <circle cx="20" cy="19" r="5" fill="#FBBF24" />
    <text x="35" y="24" fill="#FDE68A" font-size="13" font-weight="800" letter-spacing="2">PILLAR 01 · TRAFFIC GENERATION</text>

    <text x="0" y="95" fill="#FFFFFF" font-size="48" font-weight="900" letter-spacing="-1">
      Automated Traffic Generation &amp; Attribution
    </text>
    <text x="0" y="145" fill="url(#amberGrad)" font-size="32" font-weight="800">
      Zero Lost Clicks · Branded Short Links + Edge CDN Funnels
    </text>
  </g>

  <!-- Slide Counter -->
  <g transform="translate(1550, 115)">
    <rect x="0" y="0" width="230" height="48" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <text x="30" y="30" fill="#E2E8F0" font-size="15" font-weight="700" font-family="monospace">SLIDE 02 OF 05</text>
    <circle cx="195" cy="24" r="5" fill="#F59E0B" />
  </g>

  <!-- Center Architecture Diagram -->
  <g transform="translate(140, 310)">
    <!-- Main Showcase Box -->
    <rect x="0" y="0" width="1640" height="630" rx="28" fill="#0B0F19" stroke="#78350F" stroke-width="2" />

    <!-- 3 Connected Processing Nodes -->
    <!-- Node 1: Multi-Channel Entry Points -->
    <g transform="translate(60, 80)">
      <rect x="0" y="0" width="460" height="470" rx="20" fill="#140E06" stroke="#B45309" stroke-width="1.5" />
      <rect x="30" y="30" width="100" height="30" rx="8" fill="#F59E0B" fill-opacity="0.2" />
      <text x="45" y="50" fill="#FBBF24" font-size="13" font-weight="800">INPUT CHANNELS</text>
      <text x="30" y="110" fill="#FFFFFF" font-size="24" font-weight="800">Social Ads &amp; Offline Flyers</text>

      <g transform="translate(30, 140)">
        <rect x="0" y="0" width="400" height="60" rx="12" fill="#1C1408" stroke="#451A03" stroke-width="1" />
        <text x="20" y="35" fill="#E2E8F0" font-size="15" font-weight="600">Facebook / TikTok Ads · Auto-Tagged UTM</text>
      </g>
      <g transform="translate(30, 220)">
        <rect x="0" y="0" width="400" height="60" rx="12" fill="#1C1408" stroke="#451A03" stroke-width="1" />
        <text x="20" y="35" fill="#E2E8F0" font-size="15" font-weight="600">Print Banners &amp; Store Flyers · Dynamic QR</text>
      </g>
      <g transform="translate(30, 300)">
        <rect x="0" y="0" width="400" height="60" rx="12" fill="#1C1408" stroke="#451A03" stroke-width="1" />
        <text x="20" y="35" fill="#E2E8F0" font-size="15" font-weight="600">Influencer Bio Links · Custom Domain</text>
      </g>

      <rect x="30" y="390" width="400" height="50" rx="12" fill="#451A03" fill-opacity="0.4" stroke="#F59E0B" stroke-width="1" />
      <text x="45" y="422" fill="#FDE68A" font-size="14" font-weight="700">Bitly Enterprise Shortening Active</text>
    </g>

    <!-- Center Arrow 1 -->
    <path d="M 535 315 L 605 315" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6 4" />
    <polygon points="615,315 603,308 603,322" fill="#F59E0B" />

    <!-- Node 2: Sub-Second Edge Infrastructure -->
    <g transform="translate(625, 80)">
      <rect x="0" y="0" width="460" height="470" rx="20" fill="#0C0E1C" stroke="#4338CA" stroke-width="1.5" />
      <rect x="30" y="30" width="120" height="30" rx="8" fill="#6366F1" fill-opacity="0.2" />
      <text x="45" y="50" fill="#A5B4FC" font-size="13" font-weight="800">EDGE ENGINE</text>
      <text x="30" y="110" fill="#FFFFFF" font-size="24" font-weight="800">Hostinger Cloud SSD Edge</text>

      <g transform="translate(30, 140)">
        <rect x="0" y="0" width="400" height="90" rx="14" fill="#13172E" stroke="#312E81" stroke-width="1" />
        <text x="25" y="38" fill="#A5B4FC" font-size="13" font-weight="700">RESPONSE LATENCY</text>
        <text x="25" y="72" fill="#FFFFFF" font-size="28" font-weight="900">&lt; 280ms Global Load</text>
      </g>

      <g transform="translate(30, 250)">
        <rect x="0" y="0" width="400" height="90" rx="14" fill="#13172E" stroke="#312E81" stroke-width="1" />
        <text x="25" y="38" fill="#34D399" font-size="13" font-weight="700">UPTIME VERIFICATION</text>
        <text x="25" y="72" fill="#FFFFFF" font-size="28" font-weight="900">99.9% NVMe Fast SLA</text>
      </g>

      <rect x="30" y="370" width="400" height="70" rx="12" fill="#1E1B4B" stroke="#6366F1" stroke-width="1" />
      <text x="20" y="400" fill="#C7D2FE" font-size="14" font-weight="600">Zero drop-offs from slow page loading.</text>
      <text x="20" y="424" fill="#C7D2FE" font-size="14" font-weight="600">Instant first-contentful-paint (FCP).</text>
    </g>

    <!-- Center Arrow 2 -->
    <path d="M 1100 315 L 1170 315" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6 4" />
    <polygon points="1180,315 1168,308 1168,322" fill="#F59E0B" />

    <!-- Node 3: Measurable Business Result -->
    <g transform="translate(1190, 80)">
      <rect x="0" y="0" width="390" height="470" rx="20" fill="#041A14" stroke="#059669" stroke-width="1.5" />
      <rect x="30" y="30" width="110" height="30" rx="8" fill="#10B981" fill-opacity="0.2" />
      <text x="45" y="50" fill="#6EE7B7" font-size="13" font-weight="800">OUTCOME</text>
      <text x="30" y="110" fill="#FFFFFF" font-size="24" font-weight="800">Attribution Verified</text>

      <g transform="translate(30, 150)">
        <text x="0" y="50" fill="#34D399" font-size="64" font-weight="900">+34%</text>
        <text x="0" y="85" fill="#FFFFFF" font-size="18" font-weight="700">Higher CTR on Campaigns</text>
        <text x="0" y="115" fill="#94A3B8" font-size="14" font-weight="500">Every dollar tracked back to exact creative and campaign source without manual entry.</text>
      </g>

      <rect x="30" y="340" width="330" height="100" rx="14" fill="#064E3B" fill-opacity="0.3" stroke="#10B981" stroke-width="1" />
      <text x="20" y="375" fill="#A7F3D0" font-size="14" font-weight="700">100% Run on Autopilot</text>
      <text x="20" y="405" fill="#D1FAE5" font-size="13" font-weight="500">Time saved: ~2 hours / day</text>
      <text x="20" y="425" fill="#D1FAE5" font-size="13" font-weight="500">Zero spreadsheet entry required.</text>
    </g>
  </g>
</svg>
