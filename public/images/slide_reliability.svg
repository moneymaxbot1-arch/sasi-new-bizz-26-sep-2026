<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" style="background-color: #070B14; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#071520" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)" />
  <rect width="1920" height="1080" fill="url(#grid)" />
  <circle cx="960" cy="540" r="450" fill="#06B6D4" opacity="0.06" filter="blur(120px)" />

  <!-- Header -->
  <g transform="translate(140, 100)">
    <rect x="0" y="0" width="310" height="38" rx="19" fill="#164E63" fill-opacity="0.5" stroke="#06B6D4" stroke-width="1.5" />
    <circle cx="20" cy="19" r="5" fill="#38BDF8" />
    <text x="35" y="24" fill="#A5F3FC" font-size="13" font-weight="800" letter-spacing="2">PILLAR 04 · WEBSITE RELIABILITY</text>

    <text x="0" y="95" fill="#FFFFFF" font-size="48" font-weight="900" letter-spacing="-1">
      24/7 Automated Revenue Uptime Shield
    </text>
    <text x="0" y="145" fill="url(#cyanGrad)" font-size="32" font-weight="800">
      30-Second Ping Interval · Immediate Sentry SMS &amp; Webhook Alerts
    </text>
  </g>

  <!-- Slide Counter -->
  <g transform="translate(1550, 115)">
    <rect x="0" y="0" width="230" height="48" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <text x="30" y="30" fill="#E2E8F0" font-size="15" font-weight="700" font-family="monospace">SLIDE 05 OF 05</text>
    <circle cx="195" cy="24" r="5" fill="#06B6D4" />
  </g>

  <!-- Center Architecture Diagram -->
  <g transform="translate(140, 310)">
    <rect x="0" y="0" width="1640" height="630" rx="28" fill="#0B0F19" stroke="#0891B2" stroke-width="2" />

    <g transform="translate(60, 80)">
      <rect x="0" y="0" width="460" height="470" rx="20" fill="#071924" stroke="#0284C7" stroke-width="1.5" />
      <rect x="30" y="30" width="140" height="30" rx="8" fill="#0284C7" fill-opacity="0.2" />
      <text x="45" y="50" fill="#38BDF8" font-size="13" font-weight="800">THE DANGER</text>
      <text x="30" y="110" fill="#FFFFFF" font-size="24" font-weight="800">Silent Midnight Outages</text>

      <g transform="translate(30, 150)">
        <rect x="0" y="0" width="400" height="80" rx="12" fill="#062538" stroke="#0369A1" stroke-width="1" />
        <text x="20" y="35" fill="#F87171" font-size="15" font-weight="700">Broken Payment Gateways</text>
        <text x="20" y="60" fill="#CBD5E1" font-size="13" font-weight="400">Checkout API crashes while ads keep spending budget.</text>
      </g>
      <g transform="translate(30, 250)">
        <rect x="0" y="0" width="400" height="80" rx="12" fill="#062538" stroke="#0369A1" stroke-width="1" />
        <text x="20" y="35" fill="#F87171" font-size="15" font-weight="700">Expired SSL Certificates</text>
        <text x="20" y="60" fill="#CBD5E1" font-size="13" font-weight="400">Browsers show red scary warnings that scare customers.</text>
      </g>

      <rect x="30" y="370" width="400" height="70" rx="12" fill="#083344" fill-opacity="0.5" stroke="#06B6D4" stroke-width="1" />
      <text x="20" y="405" fill="#A5F3FC" font-size="14" font-weight="700">Unnoticed for hours until angry complaints arrive</text>
    </g>

    <path d="M 535 315 L 605 315" stroke="#06B6D4" stroke-width="3" stroke-dasharray="6 4" />
    <polygon points="615,315 603,308 603,322" fill="#06B6D4" />

    <g transform="translate(625, 80)">
      <rect x="0" y="0" width="460" height="470" rx="20" fill="#051C2C" stroke="#06B6D4" stroke-width="1.5" />
      <rect x="30" y="30" width="130" height="30" rx="8" fill="#06B6D4" fill-opacity="0.2" />
      <text x="45" y="50" fill="#67E8F9" font-size="13" font-weight="800">AUTOMATION</text>
      <text x="30" y="110" fill="#FFFFFF" font-size="24" font-weight="800">UptimeRobot Sentry Grid</text>

      <!-- Pulse Monitor Box -->
      <g transform="translate(30, 140)">
        <rect x="0" y="0" width="400" height="110" rx="16" fill="#04121C" stroke="#0891B2" stroke-width="1.5" />
        <!-- Pulse waveform -->
        <path d="M 20 55 L 70 55 L 85 25 L 105 85 L 120 35 L 135 65 L 150 55 L 380 55" fill="none" stroke="#22D3EE" stroke-width="3" />
        <circle cx="105" cy="85" r="4" fill="#67E8F9" />
        <text x="25" y="95" fill="#A5F3FC" font-size="12" font-weight="800">GLOBAL 30-SECOND SENTINEL VERIFICATION</text>
      </g>

      <g transform="translate(30, 270)">
        <rect x="0" y="0" width="400" height="70" rx="14" fill="#04121C" stroke="#0284C7" stroke-width="1" />
        <text x="25" y="32" fill="#38BDF8" font-size="13" font-weight="800">INSTANT DISPATCH SYSTEM</text>
        <text x="25" y="55" fill="#E2E8F0" font-size="14" font-weight="600">SMS, Telegram, and Webhook alerts in &lt; 30 seconds</text>
      </g>

      <rect x="30" y="360" width="400" height="80" rx="12" fill="#083344" stroke="#06B6D4" stroke-width="1" />
      <text x="20" y="395" fill="#A5F3FC" font-size="14" font-weight="700">Autonomous 24/7 Watchdog</text>
      <text x="20" y="420" fill="#CBD5E1" font-size="12" font-weight="400">Sleep with peace of mind knowing revenue is shielded.</text>
    </g>

    <path d="M 1100 315 L 1170 315" stroke="#06B6D4" stroke-width="3" stroke-dasharray="6 4" />
    <polygon points="1180,315 1168,308 1168,322" fill="#06B6D4" />

    <g transform="translate(1190, 80)">
      <rect x="0" y="0" width="390" height="470" rx="20" fill="#041A14" stroke="#059669" stroke-width="1.5" />
      <rect x="30" y="30" width="110" height="30" rx="8" fill="#10B981" fill-opacity="0.2" />
      <text x="45" y="50" fill="#6EE7B7" font-size="13" font-weight="800">MEASURABLE LIFT</text>
      <text x="30" y="110" fill="#FFFFFF" font-size="24" font-weight="800">Zero Lost Revenue</text>

      <g transform="translate(30, 150)">
        <text x="0" y="50" fill="#38BDF8" font-size="64" font-weight="900">99.99%</text>
        <text x="0" y="85" fill="#FFFFFF" font-size="18" font-weight="700">Verified System Uptime</text>
        <text x="0" y="115" fill="#94A3B8" font-size="14" font-weight="500">Detects payment issues instantly before any customer bounces away or files a dispute.</text>
      </g>

      <rect x="30" y="340" width="330" height="100" rx="14" fill="#064E3B" fill-opacity="0.3" stroke="#10B981" stroke-width="1" />
      <text x="20" y="375" fill="#A7F3D0" font-size="14" font-weight="700">Enterprise Reliability SLA</text>
      <text x="20" y="405" fill="#D1FAE5" font-size="13" font-weight="500">Never lose an ad dollar</text>
      <text x="20" y="425" fill="#D1FAE5" font-size="13" font-weight="500">to a dead landing page again.</text>
    </g>
  </g>
</svg>
