<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" style="background-color: #070B14; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#071912" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)" />
  <rect width="1920" height="1080" fill="url(#grid)" />
  <circle cx="960" cy="540" r="450" fill="#10B981" opacity="0.06" filter="blur(120px)" />

  <!-- Header -->
  <g transform="translate(140, 100)">
    <rect x="0" y="0" width="310" height="38" rx="19" fill="#064E3B" fill-opacity="0.5" stroke="#10B981" stroke-width="1.5" />
    <circle cx="20" cy="19" r="5" fill="#34D399" />
    <text x="35" y="24" fill="#A7F3D0" font-size="13" font-weight="800" letter-spacing="2">PILLAR 03 · RETARGETING &amp; SALES</text>

    <text x="0" y="95" fill="#FFFFFF" font-size="48" font-weight="900" letter-spacing="-1">
      Automated Omnichannel Retargeting
    </text>
    <text x="0" y="145" fill="url(#emeraldGrad)" font-size="32" font-weight="800">
      98% Open-Rate WhatsApp Broadcasts · 1-Click Abandoned Cart Recovery
    </text>
  </g>

  <!-- Slide Counter -->
  <g transform="translate(1550, 115)">
    <rect x="0" y="0" width="230" height="48" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <text x="30" y="30" fill="#E2E8F0" font-size="15" font-weight="700" font-family="monospace">SLIDE 04 OF 05</text>
    <circle cx="195" cy="24" r="5" fill="#10B981" />
  </g>

  <!-- Center Architecture Diagram -->
  <g transform="translate(140, 310)">
    <rect x="0" y="0" width="1640" height="630" rx="28" fill="#0B0F19" stroke="#047857" stroke-width="2" />

    <g transform="translate(60, 80)">
      <rect x="0" y="0" width="460" height="470" rx="20" fill="#071912" stroke="#059669" stroke-width="1.5" />
      <rect x="30" y="30" width="160" height="30" rx="8" fill="#10B981" fill-opacity="0.2" />
      <text x="45" y="50" fill="#6EE7B7" font-size="13" font-weight="800">THE REVENUE LEAK</text>
      <text x="30" y="110" fill="#FFFFFF" font-size="24" font-weight="800">Abandoned Checkouts</text>

      <g transform="translate(30, 150)">
        <rect x="0" y="0" width="400" height="80" rx="12" fill="#042F24" stroke="#065F46" stroke-width="1" />
        <text x="20" y="35" fill="#F87171" font-size="15" font-weight="700">Emails Go Unopened (18% Avg)</text>
        <text x="20" y="60" fill="#CBD5E1" font-size="13" font-weight="400">Marketing emails land in promotions or spam filters.</text>
      </g>
      <g transform="translate(30, 250)">
        <rect x="0" y="0" width="400" height="80" rx="12" fill="#042F24" stroke="#065F46" stroke-width="1" />
        <text x="20" y="35" fill="#F87171" font-size="15" font-weight="700">Lost Customers Forever</text>
        <text x="20" y="60" fill="#CBD5E1" font-size="13" font-weight="400">Without immediate multi-channel follow-up, leads never return.</text>
      </g>

      <rect x="30" y="370" width="400" height="70" rx="12" fill="#064E3B" fill-opacity="0.3" stroke="#10B981" stroke-width="1" />
      <text x="20" y="405" fill="#A7F3D0" font-size="14" font-weight="700">Manual sales calls are expensive and slow</text>
    </g>

    <path d="M 535 315 L 605 315" stroke="#10B981" stroke-width="3" stroke-dasharray="6 4" />
    <polygon points="615,315 603,308 603,322" fill="#10B981" />

    <g transform="translate(625, 80)">
      <rect x="0" y="0" width="460" height="470" rx="20" fill="#062017" stroke="#10B981" stroke-width="1.5" />
      <rect x="30" y="30" width="130" height="30" rx="8" fill="#10B981" fill-opacity="0.2" />
      <text x="45" y="50" fill="#6EE7B7" font-size="13" font-weight="800">AUTOMATION</text>
      <text x="30" y="110" fill="#FFFFFF" font-size="24" font-weight="800">WATi + Mailchimp Sync</text>

      <!-- WhatsApp Flow Card -->
      <g transform="translate(30, 140)">
        <rect x="0" y="0" width="400" height="110" rx="16" fill="#031A12" stroke="#059669" stroke-width="1.5" />
        <circle cx="45" cy="55" r="22" fill="#25D366" />
        <text x="37" y="62" fill="#FFFFFF" font-size="20" font-weight="900">W</text>
        <text x="80" y="42" fill="#FFFFFF" font-size="15" font-weight="800">Direct WhatsApp Ping (WATi)</text>
        <text x="80" y="65" fill="#A7F3D0" font-size="13" font-weight="500">"Hey David! Your cart is reserved + 10% off"</text>
        <text x="80" y="87" fill="#6EE7B7" font-size="11" font-weight="700">Triggered automatically within 45 mins ✓✓</text>
      </g>

      <g transform="translate(30, 270)">
        <rect x="0" y="0" width="400" height="70" rx="14" fill="#031A12" stroke="#D97706" stroke-width="1" />
        <text x="25" y="32" fill="#FBBF24" font-size="13" font-weight="800">MAILCHIMP BACKUP DRIP</text>
        <text x="25" y="55" fill="#E2E8F0" font-size="14" font-weight="600">Dynamic email sequence if WhatsApp not opened</text>
      </g>

      <rect x="30" y="360" width="400" height="80" rx="12" fill="#042F24" stroke="#10B981" stroke-width="1" />
      <text x="20" y="395" fill="#A7F3D0" font-size="14" font-weight="700">Official Meta WhatsApp API Approved</text>
      <text x="20" y="420" fill="#CBD5E1" font-size="12" font-weight="400">Zero phone number bans. Unlimited bulk capacity.</text>
    </g>

    <path d="M 1100 315 L 1170 315" stroke="#10B981" stroke-width="3" stroke-dasharray="6 4" />
    <polygon points="1180,315 1168,308 1168,322" fill="#10B981" />

    <g transform="translate(1190, 80)">
      <rect x="0" y="0" width="390" height="470" rx="20" fill="#041A14" stroke="#059669" stroke-width="1.5" />
      <rect x="30" y="30" width="110" height="30" rx="8" fill="#10B981" fill-opacity="0.2" />
      <text x="45" y="50" fill="#6EE7B7" font-size="13" font-weight="800">MEASURABLE LIFT</text>
      <text x="30" y="110" fill="#FFFFFF" font-size="24" font-weight="800">Sales Recovery</text>

      <g transform="translate(30, 150)">
        <text x="0" y="50" fill="#34D399" font-size="64" font-weight="900">98%</text>
        <text x="0" y="85" fill="#FFFFFF" font-size="18" font-weight="700">WhatsApp Open Rate</text>
        <text x="0" y="115" fill="#94A3B8" font-size="14" font-weight="500">Reclaims up to 31.4% of otherwise abandoned orders without paying extra for ad re-targeting.</text>
      </g>

      <rect x="30" y="340" width="330" height="100" rx="14" fill="#064E3B" fill-opacity="0.3" stroke="#10B981" stroke-width="1" />
      <text x="20" y="375" fill="#A7F3D0" font-size="14" font-weight="700">Autonomous Cash Recovery</text>
      <text x="20" y="405" fill="#D1FAE5" font-size="13" font-weight="500">Recovers $2,400+ avg extra sales</text>
      <text x="20" y="425" fill="#D1FAE5" font-size="13" font-weight="500">every month completely hands-free.</text>
    </g>
  </g>
</svg>
