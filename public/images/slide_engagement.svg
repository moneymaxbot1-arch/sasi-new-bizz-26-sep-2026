<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" style="background-color: #070B14; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#190B13" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FDA4AF" />
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)" />
  <rect width="1920" height="1080" fill="url(#grid)" />
  <circle cx="960" cy="540" r="450" fill="#F43F5E" opacity="0.06" filter="blur(120px)" />

  <!-- Header -->
  <g transform="translate(140, 100)">
    <rect x="0" y="0" width="310" height="38" rx="19" fill="#881337" fill-opacity="0.5" stroke="#F43F5E" stroke-width="1.5" />
    <circle cx="20" cy="19" r="5" fill="#FB7185" />
    <text x="35" y="24" fill="#FECDD3" font-size="13" font-weight="800" letter-spacing="2">PILLAR 02 · ENGAGEMENT &amp; SOCIAL PROOF</text>

    <text x="0" y="95" fill="#FFFFFF" font-size="48" font-weight="900" letter-spacing="-1">
      Real-Time Trust &amp; Conversion Maximizer
    </text>
    <text x="0" y="145" fill="url(#roseGrad)" font-size="32" font-weight="800">
      Verified Live Buyer Alerts · Social Proof That Eliminates Skepticism
    </text>
  </g>

  <!-- Slide Counter -->
  <g transform="translate(1550, 115)">
    <rect x="0" y="0" width="230" height="48" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <text x="30" y="30" fill="#E2E8F0" font-size="15" font-weight="700" font-family="monospace">SLIDE 03 OF 05</text>
    <circle cx="195" cy="24" r="5" fill="#F43F5E" />
  </g>

  <!-- Center Architecture Diagram -->
  <g transform="translate(140, 310)">
    <rect x="0" y="0" width="1640" height="630" rx="28" fill="#0B0F19" stroke="#881337" stroke-width="2" />

    <g transform="translate(60, 80)">
      <rect x="0" y="0" width="460" height="470" rx="20" fill="#170912" stroke="#9F1239" stroke-width="1.5" />
      <rect x="30" y="30" width="140" height="30" rx="8" fill="#F43F5E" fill-opacity="0.2" />
      <text x="45" y="50" fill="#FB7185" font-size="13" font-weight="800">THE PROBLEM</text>
      <text x="30" y="110" fill="#FFFFFF" font-size="24" font-weight="800">Cold, Silent Websites</text>

      <g transform="translate(30, 150)">
        <rect x="0" y="0" width="400" height="80" rx="12" fill="#240B1A" stroke="#4C0519" stroke-width="1" />
        <text x="20" y="35" fill="#FDA4AF" font-size="15" font-weight="700">70%+ Bounce Rates</text>
        <text x="20" y="60" fill="#CBD5E1" font-size="13" font-weight="400">Visitors think: "Is this business active? Can I trust them?"</text>
      </g>
      <g transform="translate(30, 250)">
        <rect x="0" y="0" width="400" height="80" rx="12" fill="#240B1A" stroke="#4C0519" stroke-width="1" />
        <text x="20" y="35" fill="#FDA4AF" font-size="15" font-weight="700">Zero Peer Validation</text>
        <text x="20" y="60" fill="#CBD5E1" font-size="13" font-weight="400">High friction checkout abandonment when doubts linger.</text>
      </g>

      <rect x="30" y="370" width="400" height="70" rx="12" fill="#4C0519" fill-opacity="0.3" stroke="#F43F5E" stroke-width="1" />
      <text x="20" y="405" fill="#FECDD3" font-size="14" font-weight="700">Manual testimonials are static and ignored</text>
    </g>

    <path d="M 535 315 L 605 315" stroke="#F43F5E" stroke-width="3" stroke-dasharray="6 4" />
    <polygon points="615,315 603,308 603,322" fill="#F43F5E" />

    <g transform="translate(625, 80)">
      <rect x="0" y="0" width="460" height="470" rx="20" fill="#1C0913" stroke="#E11D48" stroke-width="1.5" />
      <rect x="30" y="30" width="130" height="30" rx="8" fill="#F43F5E" fill-opacity="0.2" />
      <text x="45" y="50" fill="#FDA4AF" font-size="13" font-weight="800">AUTOMATION</text>
      <text x="30" y="110" fill="#FFFFFF" font-size="24" font-weight="800">Fomo Social Proof Engine</text>

      <!-- Live Notification Card -->
      <g transform="translate(30, 140)">
        <rect x="0" y="0" width="400" height="100" rx="16" fill="#0D0308" stroke="#FB7185" stroke-width="1.5" />
        <circle cx="45" cy="50" r="22" fill="#F43F5E" />
        <text x="38" y="57" fill="#FFFFFF" font-size="20" font-weight="900">✓</text>
        <text x="80" y="40" fill="#FFFFFF" font-size="15" font-weight="800">Marcus T. from Singapore</text>
        <text x="80" y="62" fill="#FDA4AF" font-size="13" font-weight="500">Purchased Complete Bundle ($45)</text>
        <text x="80" y="82" fill="#94A3B8" font-size="11" font-weight="600">4 minutes ago · Verified Order</text>
      </g>

      <g transform="translate(30, 260)">
        <rect x="0" y="0" width="400" height="80" rx="14" fill="#0D0308" stroke="#9F1239" stroke-width="1" />
        <text x="25" y="35" fill="#34D399" font-size="14" font-weight="800">● LIVE VISITOR COUNTER</text>
        <text x="25" y="60" fill="#FFFFFF" font-size="18" font-weight="900">148 people looking right now</text>
      </g>

      <rect x="30" y="360" width="400" height="80" rx="12" fill="#2D0616" stroke="#FB7185" stroke-width="1" />
      <text x="20" y="395" fill="#FECDD3" font-size="14" font-weight="700">Runs 24/7 on edge CDN</text>
      <text x="20" y="420" fill="#CBD5E1" font-size="12" font-weight="400">Zero manual intervention needed once integrated.</text>
    </g>

    <path d="M 1100 315 L 1170 315" stroke="#F43F5E" stroke-width="3" stroke-dasharray="6 4" />
    <polygon points="1180,315 1168,308 1168,322" fill="#F43F5E" />

    <g transform="translate(1190, 80)">
      <rect x="0" y="0" width="390" height="470" rx="20" fill="#041A14" stroke="#059669" stroke-width="1.5" />
      <rect x="30" y="30" width="110" height="30" rx="8" fill="#10B981" fill-opacity="0.2" />
      <text x="45" y="50" fill="#6EE7B7" font-size="13" font-weight="800">MEASURABLE LIFT</text>
      <text x="30" y="110" fill="#FFFFFF" font-size="24" font-weight="800">Direct Checkout Gain</text>

      <g transform="translate(30, 150)">
        <text x="0" y="50" fill="#FB7185" font-size="64" font-weight="900">+34%</text>
        <text x="0" y="85" fill="#FFFFFF" font-size="18" font-weight="700">Conversion Rate Increase</text>
        <text x="0" y="115" fill="#94A3B8" font-size="14" font-weight="500">Visitors see immediate social validation, reducing cart abandonment across mobile and desktop.</text>
      </g>

      <rect x="30" y="340" width="330" height="100" rx="14" fill="#064E3B" fill-opacity="0.3" stroke="#10B981" stroke-width="1" />
      <text x="20" y="375" fill="#A7F3D0" font-size="14" font-weight="700">Continuous Trust Loop</text>
      <text x="20" y="405" fill="#D1FAE5" font-size="13" font-weight="500">Every new buyer automatically fuels</text>
      <text x="20" y="425" fill="#D1FAE5" font-size="13" font-weight="500">future buyer confidence in real time.</text>
    </g>
  </g>
</svg>
