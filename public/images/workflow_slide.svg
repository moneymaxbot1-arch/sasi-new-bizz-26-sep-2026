    <text x="42" y="488" fill="#34D399" font-size="11" font-weight="700">WATi</text>

    <rect x="104" y="472" width="95" height="24" rx="6" fill="#F59E0B" fill-opacity="0.15" />
    <text x="114" y="488" fill="#FBBF24" font-size="11" font-weight="700">Mailchimp</text>
