  <g transform="translate(120, 80)">
    <!-- Pill Category Badge -->
    <rect x="0" y="0" width="340" height="36" rx="18" fill="#064E3B" fill-opacity="0.6" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="20" cy="18" r="5" fill="#34D399" />
    <text x="35" y="23" fill="#6EE7B7" font-size="13" font-weight="700" letter-spacing="2">24/7 AUTONOMOUS ENTERPRISE PIPELINE</text>

    <!-- Slide Title -->
    <text x="0" y="85" fill="#FFFFFF" font-size="44" font-weight="900" letter-spacing="-1">
      How Business Owners Automate
    </text>
    <text x="0" y="140" fill="url(#titleGrad)" font-size="44" font-weight="900" letter-spacing="-1">
      All Their Daily Business Activities
    </text>

    <!-- Subtitle -->
    <text x="0" y="180" fill="#94A3B8" font-size="18" font-weight="500">
      Zero manual labor: 4 interconnected pillars run continuously to generate traffic, establish trust, close sales, and protect revenue.
    </text>
