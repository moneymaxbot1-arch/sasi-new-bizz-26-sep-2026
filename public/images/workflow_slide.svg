    <rect x="0" y="0" width="250" height="52" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <text x="25" y="32" fill="#E2E8F0" font-size="14" font-weight="700" font-family="monospace">EXECUTIVE SLIDE DECK</text>
    <circle cx="215" cy="26" r="6" fill="#10B981" />
