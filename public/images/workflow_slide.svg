    <text x="42" y="325" fill="#FBBF24" font-size="24" font-weight="900">+34%</text>
    <text x="120" y="322" fill="#D6D3D1" font-size="13" font-weight="600">Higher CTR &amp; Attribution</text>

    <!-- Automation Description -->
