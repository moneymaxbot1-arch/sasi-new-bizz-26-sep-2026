    <text x="24" y="405" fill="#A8A29E" font-size="12" font-weight="400">· Automated abandoned cart WhatsApp ping</text>
    <text x="24" y="427" fill="#A8A29E" font-size="12" font-weight="400">· Multi-stage Mailchimp drip follow-ups</text>
    <text x="24" y="449" fill="#A8A29E" font-size="12" font-weight="400">· Reclaims 31.4% of lost sales on autopilot</text>

    <!-- Tool Badges -->
