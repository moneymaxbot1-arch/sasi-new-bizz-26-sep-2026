    <text x="24" y="115" fill="#34D399" font-size="14" font-weight="600">&amp; WhatsApp Recovery</text>

    <!-- Graphic / Icon Box -->
    <rect x="24" y="140" width="332" height="130" rx="16" fill="#04120D" stroke="#064E3B" stroke-width="1" />
    
