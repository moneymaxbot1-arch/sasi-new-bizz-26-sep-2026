    <text x="198" y="202" fill="#FFFFFF" font-size="11" font-weight="700">bit.ly/deal</text>
    <text x="198" y="218" fill="#34D399" font-size="10" font-weight="600">&lt;280ms Hostinger</text>

    <!-- Key Metric Highlight -->
