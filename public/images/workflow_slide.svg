    <circle cx="72" cy="195" r="14" fill="#25D366" />
    <text x="67" y="200" fill="#FFFFFF" font-size="12" font-weight="900">W</text>
    <text x="96" y="188" fill="#A7F3D0" font-size="12" font-weight="800">WhatsApp Cart Recovery</text>
    <text x="96" y="208" fill="#ECFDF5" font-size="11" font-weight="500">"Hey David! Complete order + 10% off"</text>
    <text x="96" y="226" fill="#34D399" font-size="10" font-weight="700">Sent automatically in 45 mins ✓✓</text>

    <!-- Key Metric Highlight -->
    <rect x="24" y="290" width="332" height="56" rx="12" fill="#062319" stroke="#059669" stroke-width="1" />
    <text x="42" y="325" fill="#34D399" font-size="24" font-weight="900">98%</text>
    <text x="110" y="322" fill="#D6D3D1" font-size="13" font-weight="600">Open Rate via Direct WhatsApp</text>

    <!-- Automation Description -->
