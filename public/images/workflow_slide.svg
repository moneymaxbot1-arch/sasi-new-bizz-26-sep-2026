    <text x="24" y="405" fill="#A8A29E" font-size="12" font-weight="400">· Real-time customer purchase alerts</text>
    <text x="24" y="427" fill="#A8A29E" font-size="12" font-weight="400">· Live active visitor counter widgets</text>
    <text x="24" y="449" fill="#A8A29E" font-size="12" font-weight="400">· Automated scarcity countdown timers</text>

    <!-- Tool Badges -->
    <rect x="24" y="472" width="70" height="24" rx="6" fill="#F43F5E" fill-opacity="0.15" />
    <text x="42" y="488" fill="#FB7185" font-size="11" font-weight="700">Fomo</text>

