    <text x="24" y="405" fill="#A8A29E" font-size="12" font-weight="400">· Branded custom short links on all ads</text>
    <text x="24" y="427" fill="#A8A29E" font-size="12" font-weight="400">· Offline marketing flyers with dynamic QR</text>
    <text x="24" y="449" fill="#A8A29E" font-size="12" font-weight="400">· Automatic UTM tracking in analytics</text>

    <!-- Tool Badges -->
