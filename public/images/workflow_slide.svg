    <text x="24" y="427" fill="#A8A29E" font-size="12" font-weight="400">· Instant SMS alert if checkout glitches</text>
    <text x="24" y="449" fill="#A8A29E" font-size="12" font-weight="400">· Automated SSL expiration safeguards</text>

